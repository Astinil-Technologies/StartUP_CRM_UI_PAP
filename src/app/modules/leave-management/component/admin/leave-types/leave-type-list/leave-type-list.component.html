<div class="leave-type-container">

  <!-- Header -->
  <div class="header-row">
    <h2>Leave Types</h2>

    <div class="header-actions">
      <input
        type="text"
        class="search-input"
        placeholder="Search leave types..."
        [(ngModel)]="searchText"
        (input)="onSearchChange()" />

      <button class="add-btn" (click)="onAddLeaveType()">
        + Add Leave Type
      </button>
    </div>
  </div>

  <!-- Loading -->
  <p *ngIf="loading">Loading leave types...</p>

  <!-- Error -->
  <p class="error" *ngIf="!loading && errorMessage">
    {{ errorMessage }}
  </p>

  <!-- Table -->
  <table *ngIf="!loading && sortedLeaveTypes.length">
    <thead>
      <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Yearly Quota</th>
        <th>Carry Forward</th>
        <th>Max / Month</th>
        <th>Status</th>
        <th class="action-col">Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let lt of sortedLeaveTypes">
        <td><strong>{{ lt.name }}</strong></td>
        <td>{{ lt.description || '-' }}</td>
        <td>{{ lt.yearlyQuota }}</td>
        <td>{{ lt.carryForward ? 'Yes' : 'No' }}</td>
        <td>{{ lt.maxPerMonth || '-' }}</td>

        <td>
          <span class="status-badge">
            {{ lt.active ? 'Active' : 'Inactive' }}
          </span>
        </td>

        <td class="actions">
          <button class="edit-btn" (click)="onEditLeaveType(lt.id)">Edit</button>
          <button class="delete-btn" (click)="onDeleteLeaveType(lt.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

</div>
