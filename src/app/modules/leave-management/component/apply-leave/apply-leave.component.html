<div class="apply-layout">

  <div class="apply-card">
    <h2>Apply for Leave</h2>

    <form [formGroup]="leaveForm" (ngSubmit)="submitLeave()">

      <!-- Leave Type -->
      <label>Leave Type *</label>
      <select formControlName="leaveType">
        <option value="">Select leave type</option>
        <option *ngFor="let type of leaveTypes" [value]="type">
          {{ type }}
        </option>
      </select>

      <!-- Dates -->
      <div class="date-row">
        <div>
          <label>Start Date *</label>
          <input type="date" formControlName="startDate">
        </div>

        <div>
          <label>End Date *</label>
          <input type="date" formControlName="endDate">
        </div>
      </div>

      <!-- Reason -->
      <label>Reason for Leave *</label>
      <textarea formControlName="reason"></textarea>

      <!-- File -->
      <label>Attachment (Optional)</label>
      <input type="file" (change)="onFileChange($event)">

      <!-- Buttons -->
      <div class="btn-row">
        <button class="submit" [disabled]="leaveForm.invalid">Submit Request</button>
        <button type="button" class="cancel" (click)="cancelLeave()">Cancel</button>
      </div>

    </form>
  </div>

</div>
