<div class="leave-container">
  <h2>My Leave Requests</h2>

  <div class="filters">
    <input type="text" placeholder="Search" [(ngModel)]="searchText" class="search-box" />

    <select [(ngModel)]="selectedStatus">
      <option value="">All Statuses</option>
      <option value="Pending">Pending</option>
      <option value="Approved">Approved</option>
      <option value="Rejected">Rejected</option>
    </select>

    <select [(ngModel)]="selectedType">
      <option value="">All Types</option>
      <option *ngFor="let type of leaveTypes" [value]="type">{{ type }}</option>
    </select>
  </div>

  <table class="leave-table">
    <thead>
      <tr>
        <th>Request ID</th>
        <th>Leave Type</th>
        <th>Start Date</th>
        <th>End Date</th>
        <th>Total Days</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let leave of filteredLeaves()">
        <td><a href="#">{{ leave.requestId }}</a></td>
        <td>{{ leave.type }}</td>
        <td>{{ leave.startDate }}</td>
        <td>{{ leave.endDate }}</td>
        <td>{{ leave.totalDays }}</td>
        <td>
          <span [ngClass]="getStatusClass(leave.status)">
            {{ leave.status }}
          </span>
        </td>
        <td>
          <button class="edit-btn">Edit</button>
          <button class="cancel-btn">Cancel</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
