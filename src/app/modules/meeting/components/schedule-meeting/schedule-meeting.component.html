<div class="dialog-header">
  <h2>Schedule a Meeting</h2>
  <button mat-icon-button class="close-button" (click)="onClose()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<form [formGroup]="meetingForm" (ngSubmit)="onSubmit()">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Title</mat-label>
    <input matInput formControlName="title" required />
  </mat-form-field>

  <!-- Date Picker -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Start Date</mat-label>
    <input matInput [matDatepicker]="startPicker" formControlName="startDate" />
    <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
    <mat-datepicker #startPicker></mat-datepicker>
  </mat-form-field>

  <!-- Time Input -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Start Time</mat-label>
    <input matInput type="time" formControlName="startTime" required />
  </mat-form-field>

  <!-- Date Picker -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>End Date</mat-label>
    <input matInput [matDatepicker]="endPicker" formControlName="endDate" />
    <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
    <mat-datepicker #endPicker></mat-datepicker>
  </mat-form-field>

  <!-- Time Input -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>End Time</mat-label>
    <input matInput type="time" formControlName="endTime" required />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Host ID</mat-label>
    <input matInput type="number" formControlName="hostId" required />
  </mat-form-field>

  <mat-checkbox formControlName="lobbyEnabled">Enable Lobby</mat-checkbox>

  <button mat-raised-button color="primary" type="submit">
    Schedule Meeting
  </button>
</form>
