<!-- WRAPPER -->
<div class="video-chat-wrapper" [ngClass]="{ 'chat-open': showChat }">
  <!-- 🎥 VIDEO SECTION -->
  <div class="video-container">
    <!-- ✅ Main webcam feed -->
    <video #videoElement autoplay muted playsinline></video>

    <!-- ✅ Screen sharing stream (only visible when sharing) -->
    <video
      #screenVideoElement
      *ngIf="screenSharing"
      class="screen-video"
      autoplay
      muted
      playsinline>
    </video>
  </div>

  <!-- 💬 CHAT SECTION -->
  <div class="chat-container" *ngIf="showChat">
    <app-chat
      [roomId]="meetingId"
      [username]="username"
      [messages]="chatMessages"
      (messageSent)="handleMessageSent($event)">
    </app-chat>
  </div>
</div>

<!-- 🔝 TOP BAR -->
<div class="top-bar" [ngClass]="{ 'chat-open': showChat }">
  Meeting ID: {{ meetingId }}
</div>
  <!-- Main Video Area -->
  <div class="video-area">
    <video #video autoplay muted playsinline></video>
  </div>

  <!-- Bottom Toolbar -->
  <div class="bottom-toolbar" [ngClass]="{ 'chat-open': showChat }">
    <div class="toolbar-left">
      <button mat-icon-button (click)="toggleMute()">
        <mat-icon>{{ isMuted ? 'mic_off' : 'mic' }}</mat-icon>
        <span>{{ isMuted ? 'Unmute' : 'Mute' }}</span>
      </button>

      <button mat-icon-button (click)="toggleVideo()">
        <mat-icon>{{ isVideoStopped ? 'videocam_off' : 'videocam' }}</mat-icon>
        <span>{{ isVideoStopped ? 'Start Video' : 'Stop Video' }}</span>
      </button>
    </div>
    
  
    <div class="toolbar-center">
      <div class="raised-hand" *ngIf="raisedHand">✋</div>

      <button mat-icon-button (click)="raiseHand()">
        <mat-icon>back_hand</mat-icon>
        <span>RaiseHand</span>
     </button>

      <button mat-icon-button (click)="openParticipants()">
        <mat-icon>groups</mat-icon>
        <span>Participants</span>
     </button>

<!-- Chat -->
   <button mat-icon-button (click)="openChat()">
      <mat-icon>chat</mat-icon>
      <span>Chat</span>
   </button>

<!-- Reactions -->
   <!-- Reaction Button -->
<button (click)="toggleReactions()">😊 Reactions</button>

<!-- Emoji Picker -->
<div class="emoji-picker" *ngIf="showEmojiPicker">
  <button (click)="sendReaction('👍')">👍</button>
  <button (click)="sendReaction('👎')">👎</button>
  <button (click)="sendReaction('👏')">👏</button>
  <button (click)="sendReaction('😂')">😂</button>
  <button (click)="sendReaction('❤️')">❤️</button>
  <button (click)="sendReaction('✋')">✋</button>
</div>

<!-- Share Screen -->
   <button mat-icon-button (click)="shareScreen()">
     <mat-icon>screen_share</mat-icon>
     <span>Share</span>
   </button>

<!-- Security -->
   <button mat-icon-button (click)="openSecurityOptions()">
     <mat-icon>settings</mat-icon>
     <span>Setting</span>
   </button>

    <div class="toolbar-right">
      <button mat-raised-button color="warn" (click)="leaveCall()" class="leave-button">
        <mat-icon>call_end</mat-icon>
        <span>Leave</span>
      </button>
    </div>
  </div>
</div>
