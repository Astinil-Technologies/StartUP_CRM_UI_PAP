<div class="timesheet">
  <h2>Timesheet History</h2>
  <table width="100%">
    <thead>
      <tr>
        <th>Week</th>
        <th>Total Hours</th>
        <th>Type</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let t of timesheets">
        <td>{{ t.startDate }} - {{ t.endDate }}</td>
        <td>{{ t.totalHours }}</td>
        <td>{{ t.timesheetType }}</td>
        <td>{{ t.status }}</td>
      </tr>
    </tbody>
  </table>
</div>
