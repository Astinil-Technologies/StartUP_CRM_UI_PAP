<form [formGroup]="loginForm" (ngSubmit)="onLogin()">
  <mat-form-field appearance="fill">
    <mat-label>Username or Phone Number or Email *</mat-label>
    <input matInput type="text" formControlName="email" required autocomplete="username" />
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Password *</mat-label>
    <input
      matInput
      [type]="hidePassword ? 'password' : 'text'"
      formControlName="password"
      required
      autocomplete="current-password"
    />
    <button
      mat-icon-button
      matSuffix
      type="button"
      (click)="togglePasswordVisibility()"
      aria-label="Toggle password visibility"
    >
      <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
    </button>
  </mat-form-field>

  <div class="forgot-password" (click)="ForgotPassword()">Forgot Password</div>

  <button mat-raised-button type="submit" class="login-btn">Login</button>


  <div id="google-signin-button" class="social-btn-container"></div>
  <button mat-stroked-button type="button" class="social-btn">
    Sign in with GitHub
  </button>
</form>
